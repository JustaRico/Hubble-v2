# Hubble 2.0 — single-machine stack (grown phase by phase).
# Every service sits on the hubble-net bridge so later phases talk to services
# by name, not localhost — that is what makes the multi-machine split a config
# change instead of a rewrite.

services:
  # ── Phase 1: shared DMZ ──────────────────────────────────────────────────
  copyparty-dmz:
    image: copyparty/ac:latest
    container_name: hubble-copyparty-dmz
    restart: unless-stopped
    ports:
      - "${DMZ_PORT:-13923}:3923"
    volumes:
      - ./data/dmz:/mnt/storage/shared-dmz
    # single share at /dmz; read+write for the hubble account, nothing anonymous
    command:
      - "-a"
      - "hubble:${DMZ_PASS}"
      - "-v"
      - "/mnt/storage/shared-dmz:/dmz:rwd,hubble"
    networks:
      - hubble-net

  # ── Phase 3: model gateway ───────────────────────────────────────────────
  litellm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: hubble-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-14000}:4000"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_LLAMA_SWAP_URL_V1=${LITELLM_LLAMA_SWAP_URL_V1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hubble-net

  # ── Phase 4: workstation auxiliary services ──────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: hubble-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8180}:8080"
    volumes:
      - ./config/searxng:/etc/searxng:ro
    networks:
      - hubble-net

  mcphub:
    image: samanhappy/mcphub:latest
    container_name: hubble-mcphub
    restart: unless-stopped
    depends_on:
      - copyparty-dmz
    ports:
      - "${MCPHUB_PORT:-13100}:3000"
    environment:
      - MCPHUB_CONFIG=/app/mcp_settings.json
      - JWT_SECRET=${MCPHUB_JWT_SECRET}
    volumes:
      - ./config/mcphub/mcp_settings.json:/app/mcp_settings.json
      - ./plugins/file-scanner-mcp:/app/scanner:ro
      - ./data/dmz:/data/dmz:ro
    networks:
      - hubble-net

  # ── Phase 5: Wake Gateway ──────────────────────────────────────────────
  wake-gateway:
    build:
      context: ./services/wake-gateway
      dockerfile: Dockerfile
    image: hubble/wake-gateway:latest
    container_name: hubble-wake-gw
    restart: unless-stopped
    ports:
      - "${WAKE_GW_PORT:-8811}:8811"
    environment:
      - WAKE_GW_PORT=8811
      - SAME_HOST_MODE=${SAME_HOST_MODE:-true}
      - WORKSTATION_MAC=${WORKSTATION_MAC:-}
      - WORKSTATION_BROADCAST=${WORKSTATION_BROADCAST:-255.255.255.255}
      - WOL_PORT=${WOL_PORT:-9}
      - LLAMA_SWAP_TARGET=http://host.docker.internal:10123
      - SEARXNG_TARGET=http://hubble-searxng:8080
      - FIRECRAWL_TARGET=http://host.docker.internal:3002
      - MCPHUB_TARGET=http://hubble-mcphub:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hubble-net

  # ── Phase 8: Escalation Plugin (privacy gate) ────────────────────────────
  escalation:
    build:
      context: ./services/escalation
      dockerfile: Dockerfile
    image: hubble/escalation:latest
    container_name: hubble-escalation
    restart: unless-stopped
    ports:
      - "${HUBBLE_ESCALATION_PORT:-8812}:8812"
    environment:
      - HUBBLE_ESCALATION_PORT=8812
      - LITELLM_URL=http://hubble-litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - HUBBLE_PI_MODEL=${HUBBLE_PI_MODEL:-pi-model}
      - HUBBLE_APPROVAL_TIMEOUT_MS=${HUBBLE_APPROVAL_TIMEOUT_MS:-120000}
      - HUBBLE_PI_HISTORY_WINDOW=${HUBBLE_PI_HISTORY_WINDOW:-8}
      - HUBBLE_ALLOW_TEST_CONTROLS=${HUBBLE_ALLOW_TEST_CONTROLS:-false}
      - AUDIT_DIR=/app/data/audit
    volumes:
      - ./data/audit:/app/data/audit
    depends_on:
      - litellm-gateway
    networks:
      - hubble-net

  # ── Phase 10: Design Bureau ──────────────────────────────────────────────
  design-bureau:
    build:
      context: ./services/design-bureau
      dockerfile: Dockerfile
    image: hubble/design-bureau:latest
    container_name: hubble-design-bureau
    restart: unless-stopped
    ports:
      - "${HUBBLE_DESIGN_BUREAU_PORT:-8813}:8813"
    environment:
      - HUBBLE_DESIGN_BUREAU_PORT=8813
      - LITELLM_URL=http://hubble-litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - HUBBLE_PLANNER_MODEL=${HUBBLE_PLANNER_MODEL:-planner-model}
      - HUBBLE_CODER_MODEL=${HUBBLE_CODER_MODEL:-coder-model}
      - HUBBLE_DESIGNER_MODEL=${HUBBLE_DESIGNER_MODEL:-designer-model}
      - HUBBLE_DMZ_URL=http://hubble-copyparty-dmz:3923/dmz
      - HUBBLE_DMZ_USER=${DMZ_USER:-hubble}
      - HUBBLE_DMZ_PASS=${DMZ_PASS}
      - HUBBLE_BUREAU_BRANCH_TIMEOUT_MS=${HUBBLE_BUREAU_BRANCH_TIMEOUT_MS:-300000}
      - HUBBLE_ALLOW_TEST_CONTROLS=true
    depends_on:
      - litellm-gateway
      - copyparty-dmz
    networks:
      - hubble-net

  # ── Phase 11: Research Bureau ────────────────────────────────────────────
  research-bureau:
    build:
      context: ./services/research-bureau
      dockerfile: Dockerfile
    image: hubble/research-bureau:latest
    container_name: hubble-research-bureau
    restart: unless-stopped
    ports:
      - "${HUBBLE_RESEARCH_PORT:-8814}:8814"
    environment:
      - HUBBLE_RESEARCH_PORT=8814
      - LITELLM_URL=http://hubble-litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - HUBBLE_RESEARCH_MODEL=${HUBBLE_RESEARCH_MODEL:-research-model}
      - SEARXNG_TARGET=http://hubble-searxng:8080
      - FIRECRAWL_TARGET=${FIRECRAWL_URL}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - HUBBLE_DMZ_URL=http://hubble-copyparty-dmz:3923/dmz
      - HUBBLE_DMZ_USER=${DMZ_USER:-hubble}
      - HUBBLE_DMZ_PASS=${DMZ_PASS}
      - HUBBLE_RESEARCH_MAX_ROUNDS=${HUBBLE_RESEARCH_MAX_ROUNDS:-6}
      - HUBBLE_RESEARCH_ROUND_TIMEOUT_MS=${HUBBLE_RESEARCH_ROUND_TIMEOUT_MS:-120000}
      - HUBBLE_ALLOW_TEST_CONTROLS=true
    depends_on:
      - litellm-gateway
      - searxng
      - copyparty-dmz
    networks:
      - hubble-net

  # ── Phase 6: DSH orchestrator (containerized) ────────────────────────────
  dsh-instance:
    image: hubble/dsh:latest
    container_name: hubble-dsh
    restart: unless-stopped
    ports:
      - "${HUBBLE_DSH_PORT:-3080}:80"
    environment:
      - DSH_HOME=/data/dsh-home
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DSH_BASIC_AUTH_B64=${DSH_BASIC_AUTH_B64}
    volumes:
      - ./data/dsh-home:/data/dsh-home
    networks:
      - hubble-net

networks:
  hubble-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${HUBBLE_NET_SUBNET:-172.31.99.0/24}
