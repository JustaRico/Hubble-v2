# Hubble 2.0 — single-machine stack (grown phase by phase).
# Every service sits on the hubble-net bridge so later phases talk to services
# by name, not localhost — that is what makes the multi-machine split a config
# change instead of a rewrite.

services:
  # ── Phase 1: shared DMZ ──────────────────────────────────────────────────
  copyparty-dmz:
    image: copyparty/ac:latest
    container_name: hubble-copyparty-dmz
    restart: unless-stopped
    ports:
      - "${DMZ_PORT:-13923}:3923"
    volumes:
      - ./data/dmz:/mnt/storage/shared-dmz
    # single share at /dmz; read+write for the hubble account, nothing anonymous
    command:
      - "-a"
      - "hubble:${DMZ_PASS}"
      - "-v"
      - "/mnt/storage/shared-dmz:/dmz:rwd,hubble"
    networks:
      - hubble-net

  # ── Phase 3: model gateway ───────────────────────────────────────────────
  litellm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: hubble-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-14000}:4000"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_LLAMA_SWAP_URL_V1=${LITELLM_LLAMA_SWAP_URL_V1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hubble-net

networks:
  hubble-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${HUBBLE_NET_SUBNET:-172.31.99.0/24}
